<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vé của tôi — BusGo</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <nav class="navbar" id="navbar"></nav>

    <div class="page-header">
        <div class="container">
            <h1>Vé của tôi</h1>
            <p>Quản lý tất cả các chuyến đi đã đặt</p>
        </div>
    </div>

    <div class="container section">

        <!-- Filter tabs -->
        <div style="display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="filterBookings('all', this)">Tất cả</button>
            <button class="btn btn-outline btn-sm" onclick="filterBookings('pending_payment', this)">Chờ TT</button>
            <button class="btn btn-outline btn-sm" onclick="filterBookings('paid', this)">Đã thanh toán</button>
            <button class="btn btn-outline btn-sm" onclick="filterBookings('cancelled', this)">Đã hủy</button>
            <button class="btn btn-outline btn-sm" onclick="filterBookings('completed', this)">Hoàn thành</button>
        </div>

        <div id="booking-list">
            <div style="text-align:center;padding:3rem">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let allBookings = [];

        if (!isLoggedIn()) {
            window.location.href = 'login.html';
        } else if (getRole() !== 'customer') {
            const role = getRole();
            if (role === 'admin') window.location.href = 'admin.html';
            else if (role === 'operator') window.location.href = 'operator.html';
            else window.location.href = 'index.html';
        }
        
        renderNavbar('bookings');

        async function loadBookings() {
            const res = await GET('/booking/my-bookings', true);
            if (res?.success) {
                allBookings = res.data;
                renderBookings(allBookings);
            }
        }

        function filterBookings(status, btn) {
            document.querySelectorAll('.btn-sm').forEach(b => {
                b.className = 'btn btn-outline btn-sm';
            });
            btn.className = 'btn btn-primary btn-sm';

            const filtered = status === 'all'
                ? allBookings
                : allBookings.filter(b => b.status === status);
            renderBookings(filtered);
        }

        function renderBookings(bookings) {
            if (bookings.length === 0) {
                document.getElementById('booking-list').innerHTML = `
        <div class="empty-state">
          <div class="icon">🎫</div>
          <h3>Chưa có vé nào</h3>
          <p>Đặt vé ngay để bắt đầu hành trình!</p>
          <a href="index.html"><button class="btn btn-amber" style="margin-top:1rem">Tìm chuyến xe</button></a>
        </div>`;
                return;
            }

            document.getElementById('booking-list').innerHTML = bookings.map(b => `
      <div class="card" style="margin-bottom:14px">
        <div class="card-body" style="display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
              <span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:16px">${b.booking_code}</span>
              ${statusBadge(b.status)}
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:14px;color:var(--gray-600)">
              <div>🚌 <strong>${b.company_name}</strong></div>
              <div>📍 ${b.from_city} → ${b.to_city}</div>
              <div>🕐 ${formatDateTime(b.departure_time)}</div>
              <div>💺 ${b.seat_count} ghế · ${b.vehicle_type === 'sleeper' ? 'Giường nằm' : b.vehicle_type === 'limousine' ? 'Limousine' : 'Ghế ngồi'}</div>
            </div>
          </div>

          <div style="text-align:right">
            <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:700;color:var(--amber)">${formatPrice(b.total_amount)}</div>
            <div style="font-size:12px;color:var(--gray-400);margin-bottom:10px">${formatDate(b.created_at)}</div>

            ${b.status === 'pending_payment' ? `
              <button class="btn btn-amber btn-sm" onclick="payNow(${b.id})">Thanh toán ngay</button>
            ` : ''}

            ${b.status === 'paid' ? `
              <button class="btn btn-danger btn-sm" onclick="cancelBooking(${b.id})">Hủy vé</button>
            ` : ''}
          </div>
        </div>
      </div>
    `).join('');
        }

        async function payNow(bookingId) {
            if (!confirm('Xác nhận thanh toán?')) return;
            const res = await POST(`/booking/${bookingId}/mock-payment`, {}, true);
            if (res?.success) {
                showToast('Thanh toán thành công!', 'success');
                loadBookings();
            } else {
                showToast(res?.message || 'Thanh toán thất bại.', 'error');
            }
        }

        async function cancelBooking(bookingId) {
            if (!confirm('Bạn có chắc muốn hủy vé này không? Tiền sẽ được hoàn lại.')) return;
            const res = await POST(`/booking/${bookingId}/cancel`, {}, true);
            if (res?.success) {
                showToast('Hủy vé thành công.', 'success');
                loadBookings();
            } else {
                showToast(res?.message || 'Không thể hủy vé.', 'error');
            }
        }

        loadBookings();
    </script>
</body>

</html>
