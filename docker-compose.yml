version: '3.8'

services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: bus_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_DATABASE: bus_booking
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-MatKhauCuaBan123!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql
    ports:
      - "3306:3306"

  # 2. Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bus_backend
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-MatKhauCuaBan123!}
      - DB_NAME=bus_booking
      - JWT_SECRET=${JWT_SECRET:-mot_chuoi_bi_mat_rat_dai_va_kho_doan}
      - JWT_EXPIRES_IN=1d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-chuoi_refresh_bi_mat_123}
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      - db
    ports:
      - "3000:3000"

  # 3. Frontend Nginx
  frontend:
    image: nginx:alpine
    container_name: bus_frontend
    restart: always
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
